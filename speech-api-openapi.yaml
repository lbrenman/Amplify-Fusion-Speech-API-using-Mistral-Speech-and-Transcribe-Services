openapi: 3.0.1
info:
  title: Speech API
  version: 1.2.0
  description: |
    A small speech API, backed by Mistral Voxtral.

    * **POST /transcribe**: speech to text. Upload MP3 or WAV audio, get the text back as JSON.
      The audio is sent as `multipart/form-data` with a `file` part; the language and model are
      query parameters.
    * **POST /speech**: text to speech. Post JSON text, get JSON back with the MP3 (default) or
      WAV audio as a base64 string in `audioBase64`.

    All endpoints except `/health` need an API key in the `x-api-key` header.
  contact:
    name: Leor Brenman
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://your-speech-api.example.com
    description: Deployed

security:
  - ApiKeyAuth: []

tags:
  - name: Speech to text
  - name: Text to speech
  - name: Service

paths:
  /transcribe:
    post:
      tags: [Speech to text]
      operationId: transcribeAudio
      summary: Transcribe MP3 or WAV audio to text
      description: |
        Send one audio file (MP3 or WAV, up to 25 MB and 30 minutes). The service passes it to
        Mistral's transcription endpoint unchanged and returns the text.

        Send the audio as `multipart/form-data` with a single `file` part. Raw audio bodies
        (`Content-Type: audio/mpeg` or `audio/wav`) are not accepted and return `415`.

        Options go in the query string: `POST /transcribe?language=es&model=...`.
      parameters:
        - $ref: '#/components/parameters/LanguageQuery'
        - $ref: '#/components/parameters/ModelQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscribeForm'
            encoding:
              file:
                contentType: audio/mpeg, audio/mp3, audio/wav, audio/x-wav, audio/wave
      responses:
        '200':
          description: The transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
              example:
                text: Where can I buy a train ticket?
                language: en
                durationSeconds: 2.4
                model: voxtral-mini-latest
                processingMs: 812
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'

  /speech:
    post:
      tags: [Text to speech]
      operationId: synthesizeSpeech
      summary: Turn text into MP3 or WAV audio (returned as base64 in JSON)
      description: |
        Post the text as JSON. The response is JSON with the audio as a base64 string in
        `audioBase64` (MP3 by default, WAV with `"format": "wav"`). Decode it to get the audio
        file: `atob()` in a browser, `mbedtls_base64_decode()` on an ESP32,
        `base64 -d` on the command line.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
            examples:
              simple:
                summary: Default voice, MP3
                value:
                  text: Hello! This is the speech API.
              spanishWav:
                summary: Chosen voice, WAV
                value:
                  text: ¿Dónde puedo comprar un billete de tren?
                  voice: your-voice-id
                  format: wav
      responses:
        '200':
          description: The spoken audio, base64-encoded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechResponse'
              example:
                audioBase64: SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYyLjEyLjEwMgAA...
                mimeType: audio/mpeg
                format: mp3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The text was rejected by the speech provider's content moderation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: content_rejected
                  message: The text was rejected by content moderation
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 1.2.0

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    LanguageQuery:
      in: query
      name: language
      required: false
      description: |
        ISO 639-1 code of the spoken language (for example `en`, `es`). Leave it out to let the
        model detect the language.
      schema:
        $ref: '#/components/schemas/LanguageCode'
    ModelQuery:
      in: query
      name: model
      required: false
      description: Transcription model. Defaults to the server's configured model.
      schema:
        type: string
        example: voxtral-mini-latest

  schemas:
    LanguageCode:
      type: string
      pattern: '^[a-z]{2}$'
      example: en

    TranscribeForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The audio file, MP3 or WAV. The part's filename and Content-Type should match the format.

    TranscriptionResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The transcribed text. Empty if no speech was found.
        language:
          type: string
          nullable: true
          description: The language that was given or detected (ISO 639-1), if known.
          example: en
        durationSeconds:
          type: number
          format: float
          nullable: true
          description: Length of the audio, if the provider reports it.
        model:
          type: string
          description: The model that did the transcription.
        processingMs:
          type: integer
          description: Time the service spent on the request, in milliseconds.

    SpeechRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The text to speak. Keep it to a few hundred words for the best results.
        voice:
          type: string
          description: Voice ID. Defaults to the server's configured voice.
          example: your-voice-id
        format:
          type: string
          enum: [mp3, wav]
          default: mp3
          description: Audio format of the response.
        model:
          type: string
          description: Text-to-speech model. Defaults to the server's configured model.
          example: voxtral-mini-tts-latest

    SpeechResponse:
      type: object
      required: [audioBase64, mimeType]
      properties:
        audioBase64:
          type: string
          format: byte
          description: The audio file, base64-encoded (standard alphabet, with padding).
        mimeType:
          type: string
          enum: [audio/mpeg, audio/wav]
          description: Type of the decoded audio.
        format:
          type: string
          enum: [mp3, wav]
          description: Format of the decoded audio.
        voice:
          type: string
          nullable: true
          description: The voice that was used, if known.

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
              enum:
                - bad_request
                - missing_file
                - empty_text
                - unauthorized
                - content_rejected
                - payload_too_large
                - unsupported_media_type
                - rate_limited
                - upstream_error
                - upstream_timeout
                - internal_error
            message:
              type: string
              description: Human-readable explanation.
            requestId:
              type: string
              description: ID to match this error with the server log.

  responses:
    BadRequest:
      description: The request is missing something or has an invalid value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: missing_file
              message: 'Send the audio as a "file" part in a multipart/form-data body'
    Unauthorized:
      description: Missing or wrong API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Missing or invalid x-api-key header
    PayloadTooLarge:
      description: The audio (over 25 MB) or the text (over 4000 characters) is too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The request is not multipart/form-data, or the file is not MP3 or WAV
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unsupported_media_type
              message: Send the audio as multipart/form-data with an MP3 or WAV "file" part
    TooManyRequests:
      description: Rate limit reached (here or at the provider)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: The speech provider returned an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamTimeout:
      description: The speech provider did not answer in time
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
